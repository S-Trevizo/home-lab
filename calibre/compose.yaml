networks:
  calibre_default:
    name: calibre_default

services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./calibre:/config
      - /home/xeon/data/books:/books
    ports:
      - 8083:8081   # calibre content server
      - 8084:8181   # selkies GUI
    restart: unless-stopped
    networks:
      - calibre_default

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_MODS=linuxserver/mods:universal-calibre  # enables ebook-convert for format conversion
    volumes:
      - ./calibre-web:/config
      - /home/xeon/data/books:/books
    ports:
      - 8082:8083
    restart: unless-stopped
    depends_on:
      - calibre
    networks:
      - calibre_default

  kosync:
    image: koreader/kosync:latest
    container_name: kosync
    restart: unless-stopped
    ports:
      - 17200:17200
    volumes:
      - ./kosync/data/redis:/var/lib/redis
      - ./kosync/logs/app:/app/koreader-sync-server/logs
      - ./kosync/logs/redis:/var/log/redis
    environment:
      - UID=${PUID}
      - GID=${PGID}
    networks:
      - calibre_default